services:
  - type: web
    name: vellum-vector-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn vellum_vector.wsgi --log-file -
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: vellum_vector.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "replace_me_with_supabase_connection_string"
      - key: RESEND_API_KEY
        value: "replace_me_with_resend_api_key"
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: NOTIFY_EMAIL
        value: oyekanboluwatife6@gmail.com
      - key: CORS_ALLOWED_ORIGINS
        value: "replace_me_with_vercel_frontend_url"
